<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clock</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .clock {
    display: flex;
    align-items: center;
  }

  .digit {
    position: relative;
    width: 200.2px;
    height: 371.8px;
    margin: 0 14.3px;
  }

  .seg {
    position: absolute;
    background: #1a1a1a; /* unlit segment, faintly visible like a real LCD */
  }

  .seg.on {
    background: #f5f5f5;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.55);
  }

  /* horizontal segments */
  .seg-a, .seg-g, .seg-d {
    left: 22.88px;
    width: 154.44px;
    height: 34.32px;
    clip-path: polygon(12% 0%, 88% 0%, 100% 50%, 88% 100%, 12% 100%, 0% 50%);
  }
  .seg-a { top: 0; }
  .seg-g { top: 168.74px; }
  .seg-d { top: 337.48px; }

  /* vertical segments */
  .seg-f, .seg-b, .seg-e, .seg-c {
    width: 34.32px;
    height: 160.16px;
    clip-path: polygon(0% 12%, 50% 0%, 100% 12%, 100% 88%, 50% 100%, 0% 88%);
  }
  .seg-f { top: 25.74px; left: 0; }
  .seg-b { top: 25.74px; right: 0; }
  .seg-e { top: 185.9px;  left: 0; }
  .seg-c { top: 185.9px;  right: 0; }

  .colon {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 74.36px;
    height: 371.8px;
    margin: 0 11.44px;
  }
  .colon .dot {
    width: 34.32px;
    height: 34.32px;
    border-radius: 5.72px;
    background: #f5f5f5;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.55);
  }
</style>
</head>
<body>
  <div class="clock" id="clock"></div>

  <script>
    const SEGMENTS = {
      "0": ["a", "b", "c", "d", "e", "f"],
      "1": ["b", "c"],
      "2": ["a", "b", "g", "e", "d"],
      "3": ["a", "b", "g", "c", "d"],
      "4": ["f", "g", "b", "c"],
      "5": ["a", "f", "g", "c", "d"],
      "6": ["a", "f", "g", "e", "c", "d"],
      "7": ["a", "b", "c"],
      "8": ["a", "b", "c", "d", "e", "f", "g"],
      "9": ["a", "b", "c", "d", "f", "g"],
    };
    const SEG_NAMES = ["a", "b", "c", "d", "e", "f", "g"];

    const clock = document.getElementById("clock");
    const digitEls = [];

    function makeDigit() {
      const digit = document.createElement("div");
      digit.className = "digit";
      SEG_NAMES.forEach((name) => {
        const seg = document.createElement("div");
        seg.className = "seg seg-" + name;
        digit.appendChild(seg);
      });
      return digit;
    }

    function makeColon() {
      const colon = document.createElement("div");
      colon.className = "colon";
      colon.innerHTML = '<div class="dot"></div><div class="dot"></div>';
      return colon;
    }

    // HH : MM : SS -> 6 digits with colons after index 1 and 3
    for (let i = 0; i < 6; i++) {
      const digit = makeDigit();
      digitEls.push(digit);
      clock.appendChild(digit);
      if (i === 1 || i === 3) {
        clock.appendChild(makeColon());
      }
    }

    function setDigit(el, char) {
      const on = new Set(SEGMENTS[char] || []);
      SEG_NAMES.forEach((name) => {
        const seg = el.querySelector(".seg-" + name);
        seg.classList.toggle("on", on.has(name));
      });
    }

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function updateClock() {
      const now = new Date();
      const str = pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
      for (let i = 0; i < 6; i++) {
        setDigit(digitEls[i], str[i]);
      }
    }

    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
